version: "3.9"

services:
  backend:
    build:
      context: ./morphocheck_backend
      dockerfile: Dockerfile
    container_name: morphocheck_backend
    ports:
      - "8000:8000"
    volumes:
      - ./morphocheck_backend:/app
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-morpho}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}@db:5432/${POSTGRES_DB:-morphocheck}"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in your environment}"
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      DEBUG: "false"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      CACHE_BACKEND: "${CACHE_BACKEND:-redis}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-900}"
      CACHE_MEMORY_MAX_ITEMS: "${CACHE_MEMORY_MAX_ITEMS:-512}"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: morphocheck_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  db:
    image: postgres:15
    container_name: morphocheck_db
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-morpho}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}"
      POSTGRES_DB: "${POSTGRES_DB:-morphocheck}"
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: morphocheck_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
