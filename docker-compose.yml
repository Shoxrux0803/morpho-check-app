version: "3.9"

# =============================================================================
# MorphoCheck Pro — Docker Compose
# 1-bosqich: PostgreSQL + Redis + MinIO
# 2-bosqich (keyingi): TimescaleDB
# 3-bosqich (keyingi): ClickHouse + pgvector
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./morphocheck_backend
      dockerfile: Dockerfile
    container_name: morphocheck_backend
    restart: unless-stopped
    # ports:
    #   - "${BACKEND_PORT:-8000}:8000" # Nginx orqali kiriladi
    volumes:
      - ./morphocheck_backend:/app
      - uploads_data:/app/uploads
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      SECRET_KEY: "${SECRET_KEY}"
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      DEBUG: "false"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,testserver}"
      # AI
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      # Cache / Redis
      CACHE_BACKEND: "${CACHE_BACKEND:-redis}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-900}"
      CACHE_MEMORY_MAX_ITEMS: "${CACHE_MEMORY_MAX_ITEMS:-512}"
      # DB Pool
      DB_POOL_SIZE: "${DB_POOL_SIZE:-10}"
      DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW:-20}"
      DB_POOL_RECYCLE: "${DB_POOL_RECYCLE:-300}"
      DB_POOL_TIMEOUT: "${DB_POOL_TIMEOUT:-30}"
      DB_INIT_RETRIES: "30"
      DB_INIT_DELAY: "2"
      UVICORN_WORKERS: "${UVICORN_WORKERS:-4}"
      PORT: "8000"
      # MinIO / S3
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-minio:9000}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      MINIO_BUCKET_PDF: "${MINIO_BUCKET_PDF:-morphocheck-pdfs}"
      MINIO_BUCKET_IMAGES: "${MINIO_BUCKET_IMAGES:-morphocheck-images}"
      MINIO_SECURE: "${MINIO_SECURE:-false}"
      # ClickHouse (3-bosqich: Analytics)
      CLICKHOUSE_HOST: "${CLICKHOUSE_HOST:-clickhouse}"
      CLICKHOUSE_PORT: "${CLICKHOUSE_HTTP_PORT:-8123}"
      CLICKHOUSE_DB: "${CLICKHOUSE_DB:-morphocheck_analytics}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
      # pgvector (3-bosqich: AI embeddings)
      PGVECTOR_ENABLED: "${PGVECTOR_ENABLED:-false}"
      # SMTP
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-true}"
      # Superadmin
      MORPHOCHECK_SUPERADMIN_EMAIL: "${MORPHOCHECK_SUPERADMIN_EMAIL:-}"
      MORPHOCHECK_SUPERADMIN_PASSWORD: "${MORPHOCHECK_SUPERADMIN_PASSWORD:-}"
      MORPHOCHECK_SUPERADMIN_NAME: "${MORPHOCHECK_SUPERADMIN_NAME:-Super Admin}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - morphonet

  # ---------------------------------------------------------------------------
  # Frontend (React)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: morphocheck_frontend
    restart: unless-stopped
    # ports:
    #   - "${FRONTEND_PORT:-3000}:80" # Nginx orqali kiriladi
    depends_on:
      - backend
    networks:
      - morphonet

  # ---------------------------------------------------------------------------
  # Nginx (Reverse Proxy & HTTPS)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: morphocheck_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - morphonet

  # ---------------------------------------------------------------------------
  # 2-BOSQICH: TimescaleDB (PostgreSQL 15 o'rniga — 100% compatible)
  # TimescaleDB = PostgreSQL + time-series superpowers
  # Barcha mavjud SQLAlchemy kodi o'zgarishsiz ishlaydi!
  # ---------------------------------------------------------------------------
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: morphocheck_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      PGDATA: /var/lib/postgresql/data/pgdata
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./morphocheck_backend/scripts/init_postgres.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./morphocheck_backend/scripts/init_timescale.sql:/docker-entrypoint-initdb.d/02_timescale.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - morphonet

  # ---------------------------------------------------------------------------
  # 3-BOSQICH: ClickHouse (Analytics Dashboard uchun)
  # OLAP engine — katta hajmli analytics so'rovlari uchun optimallashtirilgan
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: morphocheck_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: "${CLICKHOUSE_DB}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"   # HTTP API (curl, dbeaver)
      - "${CLICKHOUSE_NATIVE_PORT:-9009}:9000" # Native protocol
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./morphocheck_backend/scripts/init_clickhouse.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - morphonet

  # ---------------------------------------------------------------------------
  # Redis 7 (Cache va rate-limiting uchun)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: morphocheck_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --loglevel warning
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - morphonet

  # ---------------------------------------------------------------------------
  # MinIO (PDF va rasm saqlash — S3-compatible)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: morphocheck_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - morphonet

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  uploads_data:
    driver: local
  clickhouse_data:
    driver: local

networks:
  morphonet:
    driver: bridge
