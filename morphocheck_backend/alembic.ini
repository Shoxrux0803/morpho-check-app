# ============================================================
# MorphoCheck Pro — Alembic konfiguratsiyasi
# Ishlatish: morphocheck_backend/ papkasidan
#   alembic revision --autogenerate -m "description"
#   alembic upgrade head
# ============================================================

[alembic]
# alembic/ papkasiga yo'l (alembic.ini joylashgan yerdan)
script_location = alembic

# Migration fayl nomi shakli: vaqt + rev + slug
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path ga qo'shimcha papkalar (morphocheck_backend o'zi)
prepend_sys_path = .

# DATABASE_URL env.py orqali .env dan o'qiladi
# Bu yerda placeholder — haqiqiy URL env.py da belgilanadi
sqlalchemy.url = sqlite:///./morphocheck.db

# Chiqish encoding
output_encoding = utf-8

# path separator
path_separator = os

# ============================================================
# Logging
# ============================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
