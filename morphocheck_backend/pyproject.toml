[project]
name = "morphocheck_backend"
version = "0.1.0"
requires-python = ">=3.9"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black/format
    "B008",  # FastAPI intentionally uses Depends/Query/File calls as defaults
    "B904",  # API routes deliberately replace internal errors with HTTP errors
]

[tool.ruff.lint.mccabe]
max-complexity = 70

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]  # environment/bootstrap setup must precede app imports
"alembic/env.py" = ["E402"]
"scripts/migrate_sqlite_to_postgres.py" = ["E402"]
"scripts/setup_superadmin.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
