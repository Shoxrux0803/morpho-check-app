<!DOCTYPE html>
<html>
<head>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; }
    #canvas { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script type="module">
    import TubesCursor from "https://cdn.jsdelivr.net/npm/threejs-components@0.0.19/build/cursors/tubes1.min.js";
    try {
      window.app = TubesCursor(document.getElementById('canvas'), {
        tubes: { colors: ["#f967fb", "#53bc28", "#6958d5"] }
      });
      console.log("Success with canvas!");
    } catch(e) {
      console.error("Error with canvas:", e);
    }
  </script>
</body>
</html>
